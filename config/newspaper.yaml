# =====================================================================
#  HIẾN PHÁP TỜ BÁO  —  file duy nhất cha mẹ cần sửa
#  Mọi thứ về nguồn, tiêu chí, độ tuổi, sở thích đều nằm ở đây.
# =====================================================================

paper:
  name: "Báo Tốt Lành"
  tagline: "Mỗi ngày một số báo. Đọc hết là xong. Hẹn mai nhé."
  timezone: "Asia/Ho_Chi_Minh"
  articles_per_issue: 7          # số bài mỗi số báo (6–8 là hợp lý)
  publish_hour: 6                # giờ chạy mỗi sáng

# ---------------------------------------------------------------------
#  HỒ SƠ ĐỌC  — mỗi bé một mức viết lại
# ---------------------------------------------------------------------
readers:
  - id: "be-nho"
    name: "Bé 7"
    age: 7
    grade: 2
    words: [120, 180]            # độ dài bản viết lại (số chữ)
    style: >
      Câu ngắn dưới 12 chữ. Từ quen thuộc của học sinh lớp 2. Giọng kể chuyện
      ấm áp như cô giáo kể. Mỗi đoạn 2–3 câu. Có một câu mở đầu gây tò mò.
      Không dùng số quá lớn, đổi thành so sánh ("cao bằng 3 ngôi nhà").
    interests: ["vẽ", "hội họa", "màu sắc", "động vật", "minecraft", "xây nhà", "bóng đá"]
  - id: "be-lon"
    name: "Bé 11"
    age: 11
    grade: 6
    words: [300, 450]
    style: >
      Câu vừa, có thể dùng thuật ngữ nếu giải thích ngay trong ngoặc. Giọng
      như một người anh lớn kể chuyện thú vị. Có số liệu cụ thể. Kết bài bằng
      một ý mở để suy nghĩ thêm.
    interests: ["bóng đá", "ronaldo", "khoa học", "công nghệ", "kiến trúc", "minecraft", "kỷ lục", "vũ trụ"]

# ---------------------------------------------------------------------
#  CHUYÊN MỤC  — mỗi số báo cố gắng có đủ các mục "required"
# ---------------------------------------------------------------------
sections:
  - id: "the-thao-dep"
    name: "Thể thao đẹp"
    emoji: "⚽"
    required: true
    max_per_issue: 2
    what: >
      Câu chuyện khổ luyện, kỷ luật, tinh thần đồng đội, vượt khó của vận động
      viên; kỷ lục thể thao; thể thao học đường Việt Nam; khoa học trong thể thao.
    not: >
      Chuyển nhượng, lương thưởng, cá độ, tỷ lệ kèo, cầu thủ cãi vã hay ẩu đả,
      trọng tài bị chỉ trích, cổ động viên bạo lực, đời tư và bạn gái cầu thủ.
  - id: "kham-pha-khoa-hoc"
    name: "Khám phá khoa học"
    emoji: "🔬"
    required: true
    max_per_issue: 2
    what: >
      Phát minh, thí nghiệm, vũ trụ, robot, năng lượng, y học đơn giản, cách
      mọi thứ hoạt động, bí ẩn khoa học đã có lời giải.
    not: >
      Thảm họa, dịch bệnh gây hoang mang, thuyết âm mưu, tin chưa kiểm chứng.
  - id: "the-gioi-dong-vat"
    name: "Thế giới động vật"
    emoji: "🦈"
    required: true
    max_per_issue: 1
    what: >
      Sinh vật kỳ lạ, to lớn, hiếm gặp: cá mập yêu tinh, mực khổng lồ, khủng long,
      sinh vật biển sâu; hành vi thông minh của động vật; bảo tồn thành công.
      "Lạ, to, bí ẩn" là được khuyến khích vì thỏa tò mò lành mạnh.
    not: >
      Máu me, xác chết, động vật bị hành hạ, cảnh săn mồi ghê rợn, mô tả gây
      ám ảnh hay sợ đêm, ma quỷ hay kinh dị đội lốt "sinh vật lạ".
  - id: "sang-tao-kien-truc"
    name: "Sáng tạo & Kiến trúc"
    emoji: "🎨"
    required: true
    max_per_issue: 2
    what: >
      Hội họa, tranh đẹp, họa sĩ nhỏ tuổi, bảo tàng, hoạt hình được làm thế nào;
      kiến trúc, công trình kỳ vĩ, kỹ sư xây dựng, mô hình, Lego, thiết kế.
      Bài về kiến trúc nên gợi ý "xây thử trong Minecraft".
    not: >
      Quảng cáo khóa học, bất động sản, tranh cãi giá tranh, nghệ thuật gây sốc.
  - id: "guong-sang"
    name: "Gương sáng & Tài năng trẻ"
    emoji: "🌟"
    required: true
    max_per_issue: 1
    what: >
      Học sinh đạt giải, sáng chế của trẻ em, người tốt việc tốt, người vượt
      nghịch cảnh để học tập, thầy cô tận tâm, dự án cộng đồng.
    not: >
      Khoe khoang thành tích vật chất, học sinh bị áp lực, so sánh gây tổn thương.
  - id: "kham-pha-the-gioi"
    name: "Khám phá thế giới"
    emoji: "🌏"
    required: false
    max_per_issue: 1
    what: >
      Địa lý, văn hóa các nước, lịch sử Việt Nam kể hấp dẫn, danh thắng, ẩm thực
      truyền thống, lễ hội.
    not: >
      Chính trị, xung đột, tai nạn du lịch.


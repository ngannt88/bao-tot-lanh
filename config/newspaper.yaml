# ---------------------------------------------------------------------
#  TẦNG 3 — TIÊU CHÍ AI CHẤM ĐIỂM  (Haiku đọc tiêu đề + mô tả)
# ---------------------------------------------------------------------
scoring:
  model_filter: "haiku"
  model_rewrite: "sonnet"
  threshold_auto: 8       # >= 8 tự động lên báo
  threshold_review: 6     # 6–7 vào hàng chờ cha mẹ duyệt; < 6 loại
  criteria: |
    Bạn là biên tập viên tờ báo dành cho hai bé trai 7 và 11 tuổi. Bố mẹ muốn
    con được truyền cảm hứng học hỏi, tò mò lành mạnh, yêu cái đẹp, biết nỗ lực.
    Chấm mỗi bài từ 0 đến 10 theo các tiêu chí, TRỪ ĐIỂM MẠNH nếu vi phạm:

    ĐIỂM CỘNG
    - Có giá trị học hỏi thật: dạy được một điều mới, một hiện tượng, một kỹ năng.
    - Truyền cảm hứng: nỗ lực, kiên trì, sáng tạo, lòng tốt, đam mê.
    - Gợi tò mò lành mạnh: kỳ lạ, to lớn, bí ẩn có lời giải, kỷ lục.
    - Gần sở thích của các bé: bóng đá tinh thần thể thao, kiến trúc và xây dựng,
      hội họa, động vật, vũ trụ, robot.
    - Có thể biến thành hoạt động: vẽ lại, xây trong Minecraft, thử tại nhà.

    ĐIỂM TRỪ NẶNG (thường đưa về dưới 4)
    - Bạo lực, tai nạn, chết chóc, kinh dị, ma quỷ, gây sợ.
    - Cá độ, tiền bạc trong bóng đá, chuyển nhượng, tranh cãi trọng tài, đời tư.
    - Drama, YouTuber, showbiz, chửi bới, tố cáo.
    - Quảng cáo trá hình, bán hàng, khóa học, game, thiết bị mới ra mắt.
    - Chính trị, pháp luật, xét xử, chiến tranh.
    - Áp lực thi cử, điểm số, so sánh học sinh.
    - Tin thời sự thuần túy không có bài học gì (họp, phát biểu, lịch thi).
    - Nội dung cần kiến thức người lớn mới hiểu hoặc không thể viết lại cho trẻ.

    ĐỘ TIN CẬY: nếu tiêu đề giật gân, mơ hồ, "gây sốc", "không thể tin" → trừ 2.

# ---------------------------------------------------------------------
#  TẦNG 4 — VIẾT LẠI  (Sonnet đọc toàn văn, viết 2 bản + hoạt động)
# ---------------------------------------------------------------------
rewrite:
  rules: |
    - Trung thực với nguồn: không thêm sự kiện, không bịa số liệu. Nếu nguồn có
      chi tiết không phù hợp trẻ em thì BỎ HẲN, không "nói nhẹ".
    - Không nhắc tên báo gốc, không link, không "theo nguồn tin".
    - Không nói về tiền, giá, lương. Không nhắc thương hiệu trừ khi là chủ thể
      khoa học (NASA, SpaceX được; hãng điện thoại thì không).
    - Kết mỗi bài bằng một ý tích cực hoặc một câu hỏi mở, không giáo điều.
    - Tiếng Việt chuẩn, không tiếng lóng mạng, không emoji trong thân bài.
  activities:
    - id: "ve"
      name: "Góc vẽ hôm nay"
      when: "bài có hình ảnh cụ thể dễ vẽ: con vật, công trình, hành tinh, robot"
      prompt_style: "Một câu mời vẽ, gợi 2–3 chi tiết đặc trưng để vẽ cho giống."
    - id: "xay"
      name: "Thử thách xây"
      when: "bài về kiến trúc, công trình, thành phố, tàu vũ trụ, cầu, sân vận động"
      prompt_style: "Một câu mời xây trong Minecraft hoặc bằng Lego, gợi 1 đặc điểm phải có."
    - id: "thu"
      name: "Thử tại nhà"
      when: "bài khoa học có thể tái hiện an toàn bằng đồ trong nhà"
      prompt_style: "Một thí nghiệm 3 bước, an toàn tuyệt đối, có người lớn cùng làm nếu cần."
    - id: "hoi"
      name: "Câu hỏi suy nghĩ"
      when: "mọi bài"
      prompt_style: "Một câu hỏi mở, không có đáp án đúng sai, nối bài với đời sống của bé."


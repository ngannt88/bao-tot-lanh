# ---------------------------------------------------------------------
#  DỊCH — bài từ nguồn tiếng Anh được dịch SÁT sang tiếng Việt, không viết lại.
#  Giữ nguyên số đoạn, ảnh và chú thích. Mỗi bài ghi rõ "Dịch từ <nguồn>".
# ---------------------------------------------------------------------
translate:
  enabled: true
  max_per_issue: 6           # số bài dịch tối đa mỗi số (còn lại là báo Việt nguyên văn)
  model: "sonnet"            # sonnet dịch tiếng Việt mượt hơn haiku
  rules: |
    - DỊCH SÁT NGHĨA, giữ đúng ý và giọng của bài gốc. KHÔNG tóm tắt, KHÔNG viết lại,
      KHÔNG thêm lời bình, KHÔNG thêm bài học đạo đức, KHÔNG bỏ đoạn.
    - Giữ đúng số đoạn và đúng thứ tự. Mỗi đoạn gốc thành đúng một đoạn tiếng Việt.
    - Tiếng Việt tự nhiên như người Việt viết, không dịch word-by-word, không dùng
      cấu trúc câu Tây. Câu dài của bản gốc có thể tách thành hai câu Việt cho dễ đọc.
    - Giữ nguyên tên riêng, tên tổ chức. Đơn vị đo đổi sang hệ mét và ghi số tròn.
    - Thuật ngữ khó: dịch rồi mở ngoặc kèm từ tiếng Anh, ví dụ "máy tính lượng tử
      (quantum computer)". Chỉ làm một lần ở lần xuất hiện đầu tiên.
    - Không dùng tiếng lóng mạng, không emoji.

# ---------------------------------------------------------------------
#  DUYỆT TAY — mỗi sáng cha mẹ chọn bài từ danh sách ứng viên
# ---------------------------------------------------------------------
review:
  candidates_per_day: 32       # số ứng viên đưa ra cho cha mẹ chọn
  min_score_candidate: 6       # điểm AI tối thiểu để thành ứng viên (0–10)
  auto_publish:                # "lưới an toàn": đến giờ hẹn mà chưa duyệt → tự xuất bản
    enabled: true
    hour: "07:30"              # giờ tự xuất bản (Task Scheduler đọc khi đăng ký)
    min_score: 8               # chỉ lấy bài AI chấm từ 8/10; không có điểm AI → KHÔNG tự xuất bản

# ---------------------------------------------------------------------
#  TẦNG 3 — TIÊU CHÍ AI CHẤM ĐIỂM  (Haiku đọc tiêu đề + mô tả). Bài lên báo
#  hiển thị NGUYÊN VĂN báo gốc, AI không viết lại gì.
# ---------------------------------------------------------------------
scoring:
  model_filter: "haiku"
  criteria: |
    Bạn là biên tập viên tờ báo dành cho hai bé trai 7 và 11 tuổi. Bài được chọn sẽ
    hiển thị NGUYÊN VĂN cho trẻ đọc, nên chỉ chọn bài mà văn bản gốc trẻ đọc được.
    Bố mẹ muốn con được truyền cảm hứng học hỏi, tò mò lành mạnh, yêu cái đẹp, biết nỗ lực.
    Chấm mỗi bài từ 0 đến 10 theo các tiêu chí, TRỪ ĐIỂM MẠNH nếu vi phạm:

    ĐIỂM CỘNG
    - Có giá trị học hỏi thật: dạy được một điều mới, một hiện tượng, một kỹ năng.
    - Truyền cảm hứng: nỗ lực, kiên trì, sáng tạo, lòng tốt, đam mê.
    - Gợi tò mò lành mạnh: kỳ lạ, to lớn, bí ẩn có lời giải, kỷ lục.
    - Gần sở thích của các bé: bóng đá tinh thần thể thao, kiến trúc và xây dựng,
      hội họa, động vật, vũ trụ, robot.
    - Có ảnh minh họa thật, cụ thể (bài về con vật, công trình, vũ trụ, thí nghiệm).
    - Văn gốc dễ đọc, kể chuyện, không phải bài phân tích chuyên sâu.

    ĐIỂM TRỪ NẶNG (thường đưa về dưới 4)
    - Bạo lực, tai nạn, chết chóc, kinh dị, ma quỷ, gây sợ.
    - Cá độ, tiền bạc trong bóng đá, chuyển nhượng, tranh cãi trọng tài, đời tư.
    - Drama, YouTuber, showbiz, chửi bới, tố cáo.
    - Quảng cáo trá hình, bán hàng, khóa học, game, thiết bị mới ra mắt.
    - Chính trị, pháp luật, xét xử, chiến tranh.
    - Áp lực thi cử, điểm số, so sánh học sinh.
    - Tin thời sự thuần túy không có bài học gì (họp, phát biểu, lịch thi).
    - Nội dung cần kiến thức người lớn mới hiểu; bài phỏng vấn dài, bài chính sách, bài số liệu kinh tế.

    SỞ THÍCH RIÊNG CỦA HAI BÉ — thấy những thứ này thì CỘNG 1 đến 2 điểm:
    - Bóng đá và các ngôi sao lớn: Ronaldo, Messi, Yamal, Mbappe, Haaland, đội tuyển
      Việt Nam. Chỉ ở góc khổ luyện, kỷ lục, tinh thần, không phải tiền bạc hay cãi vã.
    - Minecraft, Lego, mô hình, xây dựng, kiến trúc, công trình khổng lồ.
    - Vẽ, hội họa, truyện tranh, hoạt hình, thiết kế.
    - Robot, trí tuệ nhân tạo, chip, xe tự lái, tên lửa, vũ trụ, khủng long.
    - Sinh vật kỳ lạ và khổng lồ: cá mập, mực khổng lồ, sinh vật biển sâu.
    - Kỷ lục thế giới, thứ to nhất, nhanh nhất, cổ nhất.

    ĐỘ TIN CẬY: nếu tiêu đề giật gân, mơ hồ, "gây sốc", "không thể tin" → trừ 2.

